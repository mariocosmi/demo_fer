### Configurazione mosquitto per test locale della demo
### Uso: mosquitto -c mosquitto-dev.conf -v
###
### Espone due listener sullo stesso broker:
###  - 1883  MQTT "nativo"   → usato da mosquitto_pub / mosquitto_sub
###  - 9001  MQTT su WebSocket → usato dalla pagina (config.js: broker ws://localhost:9001)

listener 1883
protocol mqtt
allow_anonymous true

listener 9001
protocol websockets
allow_anonymous true
